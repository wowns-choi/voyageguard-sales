spring.application.name=voyageguard-sales
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3308/voyageguard_sales
spring.datasource.username=root
spring.datasource.password=voyageguard1234
# 기본값(10)이면 REQUIRES_NEW(낙관적 락 재시도)가 커넥션을 2배로 먹어서 100동시요청 부하테스트에서
# 풀이 고갈돼 커넥션 풀 데드락이 남 - 부하테스트를 위해 늘림. MySQL 쪽도 docker-compose.yaml에서
# max_connections=200으로 맞춰둠.
spring.datasource.hikari.maximum-pool-size=200

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
# Outbox payload가 이미 직렬화된 JSON 문자열이라, Kafka 레벨에서는 그냥 String으로만 주고받음
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Auth 서비스가 발급한 JWT를 검증만 함(개인키 없음) - JwtVerifier 참고
jwt.public-

# Inventory 재고 차감 동시성 제어 방식 - pessimistic(기본) / optimistic / redis-decr
inventory.lock-strategy=pessimistic

# Planning 서비스 주소 - 회차 OPEN/판매종료일 확인(REST)에 사용
planning.service.base-url=http://localhost:8081

management.endpoints.web.exposure.include=health,prometheus,info

# p95/p99 같은 percentile 계산에 필요한 히스토그램 버킷 데이터를 생성함
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# 콘솔뿐 아니라 파일로도 로그를 남김(레포 안 logs/, gitignore 처리) - Promtail이 이 파일을
# 지켜보다가 Loki로 보냄
logging.file.name=logs/sales.log

# 로그를 JSON(ECS 스키마)으로 남김 - Loki에서 필드별 필터링 가능해짐
logging.structured.format.console=ecs
logging.structured.format.file=ecs
